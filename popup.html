<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Read Later</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #ffffff;
      --bg-subtle: #f9fafb;
      --fg: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    svg.icon {
      width: 14px;
      height: 14px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    #options-btn,
    #select-mode-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }
    #options-btn:hover,
    #select-mode-btn:hover { color: var(--fg); background: rgba(79, 70, 229, 0.08); }
    #options-btn svg.icon,
    #select-mode-btn svg.icon { width: 15px; height: 15px; }
    #select-mode-btn.is-active { color: var(--accent); background: rgba(79, 70, 229, 0.12); }
    #save-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: none;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #save-btn svg.icon { width: 13px; height: 13px; }
    #save-btn:hover:not(:disabled) { background: var(--accent-dark); }
    #save-btn:disabled { opacity: 0.55; cursor: default; }
    #save-btn.is-saved { background: var(--success); }

    /* status line */
    #status {
      padding: 6px 14px 0;
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
    }

    /* search bar */
    #search-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 10px 14px 6px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg-subtle);
    }
    #search-bar svg.icon { color: var(--muted); }
    #search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12.5px;
      color: var(--fg);
      min-width: 0;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-clear {
      flex: none;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 2px;
      display: flex;
    }
    #search-clear:hover { color: var(--fg); }
    #search-clear[hidden] { display: none; }

    /* tag filter row */
    #tag-filter {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin: 0 14px 8px;
      padding-bottom: 2px;
    }
    #tag-filter[hidden] { display: none; }
    #tag-filter .tag-chip {
      flex: none;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--muted);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    #tag-filter .tag-chip:hover { color: var(--fg); }
    #tag-filter .tag-chip.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* list */
    #list {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      max-height: 340px;
      overflow-y: auto;
    }
    #list li {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    #list li:hover { background: rgba(79, 70, 229, 0.06); }
    #list li[draggable="true"] { cursor: grab; }
    #list li.dragging {
      opacity: 0.4;
      cursor: grabbing;
      background: rgba(79, 70, 229, 0.06);
    }
    #list .grip {
      flex: none;
      display: flex;
      align-items: center;
      color: var(--muted);
      opacity: 0.5;
    }
    #list li[draggable="true"]:hover .grip { opacity: 1; }
    #list li:not([draggable="true"]) .grip { opacity: 0.15; }
    #list img.favicon {
      width: 16px;
      height: 16px;
      flex: none;
      border-radius: 3px;
    }
    #list .info {
      flex: 1;
      min-width: 0;
    }
    #list .title {
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #list .domain {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    #list .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }
    #list .tag-chips .tag-chip {
      font-size: 10px;
      color: var(--accent);
      background: rgba(79, 70, 229, 0.08);
      padding: 1px 6px;
      border-radius: 999px;
    }
    #list .tags-input {
      width: 100%;
      font-size: 11.5px;
      font-family: inherit;
      color: var(--fg);
      background: var(--bg-subtle);
      border: 1px solid var(--accent);
      border-radius: 5px;
      padding: 3px 6px;
      margin-top: 3px;
      outline: none;
    }
    #list .reader-btn,
    #list .tag-btn,
    #list .read-btn,
    #list .remove-btn {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 5px;
      border-radius: 5px;
    }
    #list .reader-btn:hover { color: var(--accent); background: rgba(79, 70, 229, 0.1); }
    #list .tag-btn:hover,
    #list .tag-btn.is-active { color: var(--accent); background: rgba(79, 70, 229, 0.1); }
    #list .read-btn:hover { color: var(--success); background: rgba(22, 163, 74, 0.1); }
    #list .read-btn.is-active { color: var(--success); }
    #list .remove-btn:hover { color: var(--danger); background: rgba(220, 38, 38, 0.1); }
    #list li.is-read .title {
      color: var(--muted);
      text-decoration: line-through;
    }
    #list li.is-read img.favicon { opacity: 0.5; }

    /* bulk select mode */
    #list .select-checkbox {
      flex: none;
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    #bulk-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      font-size: 11.5px;
      color: var(--fg);
      border-top: 1px solid var(--border);
      background: var(--bg-subtle);
    }
    #bulk-bar.is-visible { display: flex; }
    #bulk-bar-actions { display: flex; align-items: center; gap: 6px; }
    #bulk-bar button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 5px;
    }
    #bulk-bar button:hover:not(:disabled) { background: rgba(79, 70, 229, 0.08); color: var(--fg); }
    #bulk-bar button:disabled { opacity: 0.45; cursor: default; }
    #bulk-bar-delete:hover { color: var(--danger); background: rgba(220, 38, 38, 0.1); }
    #bulk-bar-mark-read:hover { color: var(--success); background: rgba(22, 163, 74, 0.1); }

    /* empty / no-results states */
    #empty-state,
    #no-results {
      padding: 28px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }

    /* storage usage indicator */
    #usage-info {
      display: none;
      padding: 8px 14px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    #usage-info.is-visible { display: block; }
    #usage-info.is-warning {
      color: #9a3412;
      background: #fffbeb;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Read Later</h1>
    <div class="header-actions">
      <button id="select-mode-btn" type="button" title="Select multiple">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="3"></rect>
          <polyline points="8 12 11 15 16 9"></polyline>
        </svg>
      </button>
      <button id="options-btn" type="button" title="Options">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <circle cx="9" cy="6" r="2" style="fill:currentColor;stroke:none"></circle>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <circle cx="15" cy="12" r="2" style="fill:currentColor;stroke:none"></circle>
          <line x1="4" y1="18" x2="20" y2="18"></line>
          <circle cx="7" cy="18" r="2" style="fill:currentColor;stroke:none"></circle>
        </svg>
      </button>
      <button id="save-btn" type="button" title="Save the current page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="8" height="16" rx="1"></rect>
          <rect x="13" y="4" width="8" height="16" rx="1"></rect>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="12" y1="6" x2="12" y2="18"></line>
          <line x1="6" y1="12" x2="18" y2="12"></line>
        </svg>
        <span id="save-btn-label">Save Current Page</span>
      </button>
    </div>
  </header>

  <div id="status"></div>

  <div id="search-bar">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10" cy="10" r="6"></circle>
      <line x1="16" y1="16" x2="21" y2="21"></line>
    </svg>
    <input id="search-input" type="text" placeholder="Search saved articles..." autocomplete="off" />
    <button id="search-clear" type="button" title="Clear search" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </button>
  </div>

  <div id="tag-filter" hidden></div>

  <ul id="list"></ul>
  <div id="empty-state" hidden>No saved pages yet.<br />Click "Save Current Page" to add one.</div>
  <div id="no-results" hidden>No matches found.</div>

  <div id="bulk-bar">
    <span id="bulk-bar-count"></span>
    <div id="bulk-bar-actions">
      <button id="bulk-bar-select-all" type="button">Select all</button>
      <button id="bulk-bar-mark-read" type="button">Mark read</button>
      <button id="bulk-bar-delete" type="button">Delete</button>
    </div>
  </div>

  <div id="usage-info"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
