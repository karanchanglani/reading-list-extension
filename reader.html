<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Read Later — Reader</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --bg: #ffffff;
      --bg-subtle: #f9fafb;
      --fg: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --reader-font-size: 16.5px;
      --reader-line-height: 1.7;
      --reader-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --reader-max-width: 680px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1c21;
        --bg-subtle: #232429;
        --fg: #e5e7eb;
        --muted: #9199a8;
        --border: #34363e;
      }
      :root:not([data-theme="light"]) #article-content img {
        filter: brightness(0.85); /* keep bright photos from glaring against a dark page */
      }
    }
    :root[data-theme="dark"] {
      --bg: #1b1c21;
      --bg-subtle: #232429;
      --fg: #e5e7eb;
      --muted: #9199a8;
      --border: #34363e;
    }
    :root[data-theme="dark"] #article-content img {
      filter: brightness(0.85);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 1;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .brand svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #live-link {
      flex: none;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }
    #live-link:hover { background: var(--accent); color: #fff; }
    #live-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .header-actions { display: flex; align-items: center; gap: 8px; position: relative; }
    #reader-settings-btn {
      flex: none;
      display: none;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    #reader-settings-btn.is-visible { display: flex; }
    #reader-settings-btn:hover, #reader-settings-btn.is-active { color: var(--accent); border-color: var(--accent); }
    #reader-settings-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 2;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 12px 14px;
      min-width: 190px;
    }
    #reader-settings-panel.is-visible { display: block; }
    .reader-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .reader-setting-row:last-child { margin-bottom: 0; }
    .reader-setting-row select {
      font-size: 12px;
      font-family: inherit;
      color: var(--fg);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 6px;
    }

    main {
      max-width: var(--reader-max-width);
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    #meta { display: none; }
    #meta.is-visible { display: block; }
    #article-title {
      font-size: 26px;
      line-height: 1.3;
      margin: 0 0 10px;
    }
    #article-subline {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    #article-subline span:not(:last-child)::after {
      content: "·";
      margin: 0 6px;
      color: var(--border);
    }

    #article-content {
      font-size: var(--reader-font-size);
      line-height: var(--reader-line-height);
      font-family: var(--reader-font-family);
    }
    #article-content p { margin: 0 0 1.1em; }
    #article-content h1, #article-content h2, #article-content h3 {
      line-height: 1.35;
      margin: 1.6em 0 0.6em;
    }
    #article-content img, #article-content figure, #article-content video {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 0.4em 0;
    }
    #article-content a { color: var(--accent); }
    #article-content blockquote {
      margin: 1em 0;
      padding: 4px 18px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: var(--bg-subtle);
      border-radius: 0 6px 6px 0;
    }
    #article-content pre {
      background: var(--bg-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      font-size: 13px;
    }
    #article-content code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--bg-subtle);
      border-radius: 4px;
      padding: 1px 5px;
    }
    #article-content ul, #article-content ol { padding-left: 1.4em; }

    .rl-highlight {
      background: rgba(250, 204, 21, 0.35);
      border-radius: 2px;
      cursor: pointer;
    }
    .rl-highlight.has-note { box-shadow: inset 0 -2px 0 var(--accent); }

    #highlight-toolbar {
      display: none;
      position: fixed;
      z-index: 3;
      transform: translate(-50%, -100%);
      background: var(--fg);
      color: var(--bg);
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }
    #highlight-toolbar.is-visible { display: block; }

    .rl-highlight-popover {
      position: fixed;
      z-index: 3;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      padding: 12px 14px;
      width: 240px;
    }
    .rl-highlight-popover .quote {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      margin: 0 0 8px;
      max-height: 4.5em;
      overflow-y: auto;
    }
    .rl-highlight-popover textarea {
      width: 100%;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--fg);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      resize: vertical;
      min-height: 50px;
      box-sizing: border-box;
    }
    .rl-highlight-popover .actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }
    .rl-highlight-popover button {
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
    }
    .rl-highlight-popover .save-btn { border-color: var(--accent); color: var(--accent); }
    .rl-highlight-popover .save-btn:hover { background: var(--accent); color: #fff; }
    .rl-highlight-popover .remove-btn:hover { color: #dc2626; border-color: #dc2626; }

    #state {
      max-width: 480px;
      margin: 80px auto 0;
      padding: 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.6;
    }
    #state a { color: var(--accent); font-weight: 600; }
    #state[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="13" height="18" rx="2"></rect>
        <line x1="7" y1="3" x2="7" y2="21"></line>
        <line x1="20" y1="6" x2="20" y2="14"></line>
        <line x1="16" y1="10" x2="24" y2="10"></line>
      </svg>
      Read Later — Reader
    </div>
    <div class="header-actions">
      <a id="live-link" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="9" width="12" height="12" rx="1"></rect>
          <polyline points="10 3 21 3 21 14"></polyline>
          <line x1="21" y1="3" x2="10" y2="14"></line>
        </svg>
        View live page
      </a>
      <button id="reader-settings-btn" type="button" aria-label="Reading settings" title="Reading settings">Aa</button>
      <div id="reader-settings-panel">
        <div class="reader-setting-row">
          <label for="reader-font-size-select">Size</label>
          <select id="reader-font-size-select">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="xlarge">Extra large</option>
          </select>
        </div>
        <div class="reader-setting-row">
          <label for="reader-font-family-select">Font</label>
          <select id="reader-font-family-select">
            <option value="sans">Sans-serif</option>
            <option value="serif">Serif</option>
          </select>
        </div>
        <div class="reader-setting-row">
          <label for="reader-width-select">Width</label>
          <select id="reader-width-select">
            <option value="narrow">Narrow</option>
            <option value="default">Default</option>
            <option value="wide">Wide</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="meta">
      <h1 id="article-title"></h1>
      <p id="article-subline"></p>
      <div id="article-content"></div>
    </div>
    <p id="state" hidden></p>
  </main>

  <button id="highlight-toolbar" type="button">Highlight</button>

  <script type="module" src="theme.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
